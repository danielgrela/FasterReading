<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FasterReading — Lectura rápida RSVP</title>
    <meta
      name="description"
      content="Lee cualquier PDF palabra por palabra a la velocidad que elijas. 100% local, sin backend."
    />
    <link rel="stylesheet" href="css/style.css?v=9" />
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand">Faster<span>Reading</span></h1>
      <div class="topbar-right">
        <span id="fileName" class="file-name" title="">Ningún PDF cargado</span>
        <label class="btn btn-ghost" for="pdfInput">Subir PDF</label>
        <input id="pdfInput" type="file" accept="application/pdf,.pdf" hidden />
        <button
          id="themeBtn"
          class="btn btn-ghost btn-icon"
          type="button"
          aria-label="Cambiar tema"
          title="Cambiar tema"
        >
          ◐
        </button>
      </div>
    </header>

    <main class="stage" id="stage">
      <p id="counter" class="counter" aria-live="off">Palabra 0 de 0 · Página 0 de 0 · 0 % leído · 0 min restantes</p>
      <p id="prevWord" class="ctx ctx-prev" aria-hidden="true"></p>
      <p id="nextWord" class="ctx ctx-next" aria-hidden="true"></p>
      <div id="word" class="word" role="status" aria-live="off" aria-label="Palabra actual">
        <span class="w-left"></span><span class="w-pivot">·</span><span class="w-right"></span>
      </div>

      <p id="message" class="message">Sube un PDF para empezar. Todo se procesa en tu navegador.</p>
      <div id="dropzone" class="dropzone" hidden>Suelta el PDF aquí</div>
    </main>

    <footer class="panel">
      <div class="progress-row">
        <input
          id="progress"
          type="range"
          min="0"
          max="0"
          value="0"
          step="1"
          disabled
          aria-label="Posición en el texto"
        />
        <span id="progressText" class="progress-text">0 / 0</span>
      </div>

      <div class="controls">
        <div class="buttons">
          <button id="playBtn" class="btn btn-primary" type="button" disabled>▶ Play</button>
          <button id="pauseBtn" class="btn" type="button" disabled>⏸ Pause</button>
          <button id="resetBtn" class="btn" type="button" disabled>↺ Reset</button>
        </div>

        <div class="goto">
          <span class="goto-group">
            <label for="gotoInput">Ir a</label>
            <input
              id="gotoInput"
              class="field"
              type="text"
              placeholder="nº o palabra"
              autocomplete="off"
              aria-label="Número de palabra o palabra a buscar"
            />
            <button id="gotoBtn" class="btn" type="button">Ir</button>
          </span>
          <span class="goto-group">
            <label for="pageInput">Página</label>
            <input
              id="pageInput"
              class="field"
              type="number"
              min="1"
              step="1"
              placeholder="nº"
              autocomplete="off"
              aria-label="Número de página"
            />
            <button id="pageBtn" class="btn" type="button">Ir</button>
          </span>
        </div>

        <div class="wpm">
          <label for="wpmRange">Velocidad</label>
          <input id="wpmRange" type="range" min="50" max="700" step="10" value="300" />
          <span class="wpm-num">
            <input id="wpmInput" class="field" type="number" min="50" max="700" step="1" value="300" aria-label="WPM" />
            WPM
          </span>
          <span id="msOut" class="ms">200 ms/palabra</span>
        </div>

        <label class="toggle" title="Pausa del doble de los ms/palabra al final de cada frase y de cada párrafo">
          <input id="breakToggle" type="checkbox" checked />
          Frases separadas
        </label>
      </div>

      <p class="hint">
        Atajos: <kbd>Espacio</kbd> play/pausa · <kbd>R</kbd> reset · <kbd>←</kbd><kbd>→</kbd> ±10 palabras · <kbd>↑</kbd
        ><kbd>↓</kbd> ±10 WPM
      </p>
    </footer>

    <!-- ?v= evita que el navegador use un app.js antiguo de la caché: súbelo al cambiar el JS (ver Setup). -->
    <script type="module" src="js/app.js?v=9"></script>
  </body>
</html>
